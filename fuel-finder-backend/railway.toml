# Railway service settings (set in the dashboard, not here):
#   Root Directory:   /fuel-finder-backend
#   Config file path: /fuel-finder-backend/railway.toml  (Railway does not resolve it relative to the root dir)
#   Volume:           attach one; SQLite lives at $RAILWAY_VOLUME_MOUNT_PATH/fuel_finder.db

[build]
builder = "DOCKERFILE"
# Only redeploy when backend files change (patterns match from the repo root).
watchPatterns = ["/fuel-finder-backend/**"]

[deploy]
# Start command comes from the Dockerfile CMD (binds to $PORT).
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
